<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"
     aria-label="高校の授業実践の模式図。スクリーンに浸水・土砂災害・公共施設を重ねた地図を映し、災害リスクのある公共施設はどこかを生徒が考える様子を示す仮画像">
<!-- 表示幅は約329px（縮小率0.21倍）。本文文字は58px以上とし、画面上で12px相当を確保している -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef4fc"/><stop offset="1" stop-color="#dbe7f7"/>
  </linearGradient>
  <clipPath id="k1"><polygon points="280,360 470,280 660,360 470,440"/></clipPath>
  <clipPath id="k2"><polygon points="280,440 470,360 660,440 470,520"/></clipPath>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>

<g font-family="'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">

  <text x="80" y="118" font-size="66" font-weight="700" fill="#005bba">高校「地理総合」での授業</text>

  <!-- スクリーン -->
  <rect x="120" y="210" width="700" height="400" rx="12" fill="#fff" stroke="#c6d7ec" stroke-width="3"/>
  <path d="M120 222 a12 12 0 0 1 12-12 h676 a12 12 0 0 1 12 12 v34 h-700 z" fill="#f5f8fd"/>
  <line x1="120" y1="256" x2="820" y2="256" stroke="#dfe5ef" stroke-width="3"/>

  <polygon points="280,520 470,440 660,520 470,600" fill="#fff" stroke="#5b9be6" stroke-width="4"/>
  <g stroke="#a9c6e8" stroke-width="3">
    <line x1="337" y1="496" x2="527" y2="576"/><line x1="394" y1="472" x2="584" y2="552"/>
    <line x1="337" y1="544" x2="527" y2="464"/><line x1="394" y1="568" x2="584" y2="488"/>
  </g>
  <polygon points="280,440 470,360 660,440 470,520" fill="#fff" fill-opacity=".9" stroke="#5b9be6" stroke-width="4"/>
  <g clip-path="url(#k2)">
    <ellipse cx="425" cy="444" rx="104" ry="38" fill="#5b9be6" fill-opacity=".45"/>
    <ellipse cx="530" cy="430" rx="66" ry="26" fill="#c98b2e" fill-opacity=".38"/>
  </g>
  <polygon points="280,360 470,280 660,360 470,440" fill="#fff" fill-opacity=".94" stroke="#5b9be6" stroke-width="4"/>
  <g clip-path="url(#k1)" fill="#005bba">
    <circle cx="400" cy="360" r="14"/><circle cx="480" cy="336" r="14"/>
    <circle cx="512" cy="378" r="14"/><circle cx="562" cy="352" r="14"/>
  </g>

  <!-- スクリーンの脚 -->
  <path d="M440 610 L500 610 L520 660 L420 660 Z" fill="#c6d7ec"/>
  <rect x="370" y="658" width="200" height="10" rx="5" fill="#b3c7e0"/>

  <!-- 問い -->
  <text x="890" y="356" font-size="68" font-weight="700" fill="#12203a">災害リスクの</text>
  <text x="890" y="434" font-size="68" font-weight="700" fill="#12203a">ある公共施設</text>
  <text x="890" y="512" font-size="68" font-weight="700" fill="#12203a">はどこか？</text>
  <rect x="890" y="546" width="220" height="10" fill="#ffd600"/>
  <text x="890" y="624" font-size="50" fill="#5a6b87">生徒が自分で問いを立てる</text>

  <!-- 生徒 -->
  <g fill="#8fa8c8">
    <circle cx="300" cy="748" r="32"/><path d="M260 838 L260 792 A40 40 0 0 1 340 792 L340 838 Z"/>
    <circle cx="470" cy="748" r="32"/><path d="M430 838 L430 792 A40 40 0 0 1 510 792 L510 838 Z"/>
    <circle cx="810" cy="748" r="32"/><path d="M770 838 L770 792 A40 40 0 0 1 850 792 L850 838 Z"/>
  </g>
  <g fill="#005bba">
    <circle cx="640" cy="748" r="32"/><path d="M600 838 L600 792 A40 40 0 0 1 680 792 L680 838 Z"/>
  </g>

  <text x="890" y="762" font-size="44" fill="#7d8fae">※ 撮影者・学校の許諾を得た</text>
  <text x="890" y="806" font-size="44" fill="#7d8fae">　写真に差し替える予定の</text>
  <text x="890" y="850" font-size="44" fill="#7d8fae">　模式図です</text>

  <rect x="1240" y="34" width="320" height="104" rx="52" fill="#ffd600"/>
  <text x="1400" y="104" font-size="68" font-weight="700" fill="#050a18" text-anchor="middle">仮画像</text>
</g>
</svg>
