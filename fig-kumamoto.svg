<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img"
     aria-label="令和8年熊本地震の特集。2026年7月28日16時27分、マグニチュード7.1。地震の全体像、ライフラインと避難、医療機関、交通・物流、二次災害の5つの視点で地図にまとめた図">
<!-- 表示幅は約454px（縮小率0.28倍）。本文文字は44px以上とし、画面上で12px相当を確保している -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#fdf3f0"/><stop offset="1" stop-color="#f6e4e8"/>
  </linearGradient>
</defs>

<rect width="1600" height="1000" fill="url(#bg)"/>

<g font-family="'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">

  <rect x="80" y="96" width="10" height="128" fill="#a50021"/>
  <text x="118" y="164" font-size="72" font-weight="700" fill="#12203a">令和8年 熊本地震</text>
  <text x="118" y="216" font-size="42" fill="#5a6b87">2026年7月28日 16:27 ／ M7.1 ／ 熊本県熊本地方</text>

  <!-- 推計震度分布の凡例（気象庁の配色） -->
  <text x="80" y="316" font-size="40" fill="#7d8fae">推計震度分布</text>
  <g>
    <rect x="320" y="278" width="132" height="70" rx="10" fill="#b40068"/>
    <text x="386" y="325" font-size="46" font-weight="700" fill="#fff" text-anchor="middle">7</text>
    <rect x="466" y="278" width="132" height="70" rx="10" fill="#a50021"/>
    <text x="532" y="325" font-size="42" font-weight="700" fill="#fff" text-anchor="middle">6強</text>
    <rect x="612" y="278" width="132" height="70" rx="10" fill="#ff2800"/>
    <text x="678" y="325" font-size="42" font-weight="700" fill="#fff" text-anchor="middle">6弱</text>
    <rect x="758" y="278" width="132" height="70" rx="10" fill="#ff9900"/>
    <text x="824" y="325" font-size="42" font-weight="700" fill="#12203a" text-anchor="middle">5強</text>
    <rect x="904" y="278" width="132" height="70" rx="10" fill="#ffe600"/>
    <text x="970" y="325" font-size="42" font-weight="700" fill="#12203a" text-anchor="middle">5弱</text>
  </g>

  <line x1="80" y1="396" x2="1520" y2="396" stroke="#e3cfd4" stroke-width="3"/>

  <text x="80" y="466" font-size="46" font-weight="700" fill="#a50021">5つの視点で、地図にしました</text>

  <g font-size="46" fill="#12203a">
    <circle cx="106" cy="508" r="9" fill="#a50021"/><text x="140" y="524">地震の全体像</text>
    <circle cx="106" cy="570" r="9" fill="#a50021"/><text x="140" y="586">ライフラインと避難の状況</text>
    <circle cx="106" cy="632" r="9" fill="#a50021"/><text x="140" y="648">医療機関への影響</text>
    <circle cx="106" cy="694" r="9" fill="#a50021"/><text x="140" y="710">交通・物流の寸断リスク</text>
    <circle cx="106" cy="756" r="9" fill="#a50021"/><text x="140" y="772">二次災害の警戒（雨と土砂）</text>
  </g>

  <!-- y=840 より下は、スライドのリンク帯が重なるため空けておく -->

</g>
</svg>
