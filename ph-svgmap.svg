<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"
     aria-label="SVGMapの仕組みの模式図。行政・研究機関・民間のサーバにデータを置いたまま、閲覧者のブラウザ上で重ね合わせる様子を示す仮画像">
<!-- 表示幅は約329px（縮小率0.21倍）。本文文字は58px以上とし、画面上で12px相当を確保している -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef4fc"/><stop offset="1" stop-color="#dbe7f7"/>
  </linearGradient>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#5b9be6"/>
  </marker>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>

<g font-family="'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">

  <text x="80" y="122" font-size="66" font-weight="700" fill="#005bba">ブラウザの上で重ねる</text>

  <!-- 左：データの持ち主（サーバは各組織に置かれたまま） -->
  <g>
    <rect x="80" y="270" width="400" height="130" rx="12" fill="#fff" stroke="#c6d7ec" stroke-width="3"/>
    <rect x="112" y="305" width="60" height="60" rx="8" fill="#005bba"/>
    <rect x="124" y="318" width="36" height="7" rx="3.5" fill="#fff"/><rect x="124" y="332" width="36" height="7" rx="3.5" fill="#fff"/><rect x="124" y="346" width="20" height="7" rx="3.5" fill="#fff"/>
    <text x="198" y="356" font-size="58" fill="#12203a">行政</text>

    <rect x="80" y="420" width="400" height="130" rx="12" fill="#fff" stroke="#c6d7ec" stroke-width="3"/>
    <rect x="112" y="455" width="60" height="60" rx="8" fill="#005bba"/>
    <rect x="124" y="468" width="36" height="7" rx="3.5" fill="#fff"/><rect x="124" y="482" width="36" height="7" rx="3.5" fill="#fff"/><rect x="124" y="496" width="20" height="7" rx="3.5" fill="#fff"/>
    <text x="198" y="506" font-size="58" fill="#12203a">研究機関</text>

    <rect x="80" y="570" width="400" height="130" rx="12" fill="#fff" stroke="#c6d7ec" stroke-width="3"/>
    <rect x="112" y="605" width="60" height="60" rx="8" fill="#005bba"/>
    <rect x="124" y="618" width="36" height="7" rx="3.5" fill="#fff"/><rect x="124" y="632" width="36" height="7" rx="3.5" fill="#fff"/><rect x="124" y="646" width="20" height="7" rx="3.5" fill="#fff"/>
    <text x="198" y="656" font-size="58" fill="#12203a">民間</text>
  </g>

  <!-- 中央：参照だけが渡り、データそのものは動かない -->
  <g fill="none" stroke="#5b9be6" stroke-width="5" stroke-dasharray="14 12" marker-end="url(#ar)">
    <path d="M492 335 Q700 335 890 430"/>
    <path d="M492 485 Q700 485 890 460"/>
    <path d="M492 635 Q700 635 890 490"/>
  </g>

  <!-- 右：閲覧者のブラウザ -->
  <g>
    <rect x="900" y="250" width="620" height="420" rx="14" fill="#fff" stroke="#c6d7ec" stroke-width="3"/>
    <path d="M900 264 a14 14 0 0 1 14-14 h592 a14 14 0 0 1 14 14 v46 h-620 z" fill="#f5f8fd"/>
    <line x1="900" y1="310" x2="1520" y2="310" stroke="#dfe5ef" stroke-width="3"/>
    <circle cx="934" cy="280" r="9" fill="#cdd6e4"/><circle cx="962" cy="280" r="9" fill="#cdd6e4"/><circle cx="990" cy="280" r="9" fill="#cdd6e4"/>

    <polygon points="1010,570 1210,485 1410,570 1210,655" fill="#fff" stroke="#5b9be6" stroke-width="4"/>
    <g stroke="#a9c6e8" stroke-width="3">
      <line x1="1070" y1="545" x2="1270" y2="630"/><line x1="1130" y1="519" x2="1330" y2="604"/>
      <line x1="1070" y1="595" x2="1270" y2="510"/><line x1="1130" y1="621" x2="1330" y2="536"/>
    </g>
    <polygon points="1010,485 1210,400 1410,485 1210,570" fill="#fff" fill-opacity=".9" stroke="#5b9be6" stroke-width="4"/>
    <ellipse cx="1175" cy="489" rx="96" ry="34" fill="#5b9be6" fill-opacity=".45"/>
    <polygon points="1010,400 1210,315 1410,400 1210,485" fill="#fff" fill-opacity=".94" stroke="#5b9be6" stroke-width="4"/>
    <g fill="#005bba"><circle cx="1155" cy="400" r="13"/><circle cx="1240" cy="376" r="13"/><circle cx="1272" cy="418" r="13"/></g>
  </g>

  <text x="80" y="796" font-size="58" font-weight="700" fill="#12203a">データは動かない</text>
  <text x="80" y="862" font-size="44" fill="#7d8fae">※ 実際の画面キャプチャに差し替える予定の模式図です</text>

  <rect x="1240" y="34" width="320" height="104" rx="52" fill="#ffd600"/>
  <text x="1400" y="104" font-size="68" font-weight="700" fill="#050a18" text-anchor="middle">仮画像</text>
</g>
</svg>
