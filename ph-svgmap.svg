<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"
     aria-label="ハイパーレイヤリングの模式図。背景地図・浸水想定・道路交通・避難所の4つのレイヤーが1枚の地図として重なり合う様子を示す仮画像">
<!-- 表示幅は約329px（縮小率0.21倍）。本文文字は58px以上とし、画面上で12px相当を確保している -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef4fc"/><stop offset="1" stop-color="#dbe7f7"/>
  </linearGradient>
  <clipPath id="s1"><polygon points="230,300 520,180 810,300 520,420"/></clipPath>
  <clipPath id="s2"><polygon points="230,430 520,310 810,430 520,550"/></clipPath>
  <clipPath id="s3"><polygon points="230,560 520,440 810,560 520,680"/></clipPath>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>

<g font-family="'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">

  <text x="80" y="112" font-size="66" font-weight="700" fill="#005bba">250種類以上のレイヤー</text>

  <!-- 下から順に描画し、上のレイヤーが手前に重なるようにする -->

  <polygon points="230,690 520,570 810,690 520,810" fill="#fff" fill-opacity=".9" stroke="#5b9be6" stroke-width="4"/>
  <g stroke="#a9c6e8" stroke-width="3">
    <line x1="288" y1="666" x2="578" y2="786"/><line x1="346" y1="642" x2="636" y2="762"/>
    <line x1="404" y1="618" x2="694" y2="738"/><line x1="462" y1="594" x2="752" y2="714"/>
    <line x1="288" y1="714" x2="578" y2="594"/><line x1="346" y1="738" x2="636" y2="618"/>
    <line x1="404" y1="762" x2="694" y2="642"/><line x1="462" y1="786" x2="752" y2="666"/>
  </g>

  <polygon points="230,560 520,440 810,560 520,680" fill="#fff" fill-opacity=".9" stroke="#5b9be6" stroke-width="4"/>
  <g clip-path="url(#s3)">
    <ellipse cx="455" cy="572" rx="160" ry="56" fill="#5b9be6" fill-opacity=".5"/>
    <ellipse cx="600" cy="548" rx="102" ry="36" fill="#5b9be6" fill-opacity=".36"/>
  </g>

  <polygon points="230,430 520,310 810,430 520,550" fill="#fff" fill-opacity=".9" stroke="#5b9be6" stroke-width="4"/>
  <g clip-path="url(#s2)" stroke="#005bba" stroke-width="9" stroke-linecap="round">
    <line x1="320" y1="388" x2="610" y2="508"/>
    <line x1="405" y1="353" x2="695" y2="473"/>
    <line x1="365" y1="490" x2="655" y2="370"/>
  </g>

  <polygon points="230,300 520,180 810,300 520,420" fill="#fff" fill-opacity=".94" stroke="#5b9be6" stroke-width="4"/>
  <g clip-path="url(#s1)">
    <path d="M400 300 L465 336 L590 328" fill="none" stroke="#ffd600" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#005bba">
      <circle cx="400" cy="300" r="19"/><circle cx="520" cy="268" r="19"/>
      <circle cx="590" cy="328" r="19"/><circle cx="465" cy="336" r="19"/>
      <circle cx="648" cy="286" r="19"/>
    </g>
  </g>

  <g stroke="#8fa8c8" stroke-width="3">
    <line x1="816" y1="300" x2="856" y2="300"/><line x1="816" y1="430" x2="856" y2="430"/>
    <line x1="816" y1="560" x2="856" y2="560"/><line x1="816" y1="690" x2="856" y2="690"/>
  </g>
  <g font-size="58" fill="#12203a">
    <text x="872" y="318">避難所</text>
    <text x="872" y="448">道路・交通</text>
    <text x="872" y="578">浸水想定</text>
    <text x="872" y="708">背景地図</text>
  </g>

  <text x="80" y="862" font-size="44" fill="#7d8fae">※ 実際の画面キャプチャに差し替える予定の模式図です</text>

  <rect x="1240" y="34" width="320" height="104" rx="52" fill="#ffd600"/>
  <text x="1400" y="104" font-size="68" font-weight="700" fill="#050a18" text-anchor="middle">仮画像</text>
</g>
</svg>
