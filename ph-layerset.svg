<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"
     aria-label="目的別レイヤーセット5種の一覧。避難先・避難経路、広域被害ポテンシャル、交通・サプライチェーン、重要施設の脆弱性、リアルタイム監視を示す仮画像">
<!-- 表示幅は約329px（縮小率0.21倍）。本文文字は58px以上とし、画面上で12px相当を確保している
     並び順は研究会の位置づけに従う。「どこへ、どの経路で逃げるか」が最初に考える事項 -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef4fc"/><stop offset="1" stop-color="#dbe7f7"/>
  </linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>

<g font-family="'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">

  <text x="80" y="112" font-size="66" font-weight="700" fill="#005bba">目的別レイヤーセット</text>
  <text x="80" y="176" font-size="48" fill="#5a6b87">重ねる組み合わせを、1つのURLに</text>

  <g transform="translate(0,215)">
    <rect x="80" y="0" width="1440" height="104" rx="12" fill="#fffdf2" stroke="#ffd600" stroke-width="4"/>
    <circle cx="152" cy="52" r="36" fill="#ffd600"/>
    <text x="152" y="70" font-size="46" font-weight="700" fill="#050a18" text-anchor="middle">1</text>
    <text x="228" y="72" font-size="60" fill="#12203a">避難先・避難経路</text>
    <g fill="#f0dc8a"><rect x="1320" y="24" width="150" height="10" rx="5"/><rect x="1320" y="44" width="150" height="10" rx="5"/><rect x="1320" y="64" width="150" height="10" rx="5"/><rect x="1320" y="84" width="150" height="10" rx="5"/></g>
  </g>
  <g transform="translate(0,335)">
    <rect x="80" y="0" width="1440" height="104" rx="12" fill="#fff" stroke="#d6e3f4" stroke-width="3"/>
    <circle cx="152" cy="52" r="36" fill="#005bba"/>
    <text x="152" y="70" font-size="46" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="228" y="72" font-size="60" fill="#12203a">広域被害ポテンシャル</text>
    <g fill="#c6d7ec"><rect x="1320" y="24" width="150" height="10" rx="5"/><rect x="1320" y="44" width="150" height="10" rx="5"/><rect x="1320" y="64" width="150" height="10" rx="5"/><rect x="1320" y="84" width="150" height="10" rx="5"/></g>
  </g>
  <g transform="translate(0,455)">
    <rect x="80" y="0" width="1440" height="104" rx="12" fill="#fff" stroke="#d6e3f4" stroke-width="3"/>
    <circle cx="152" cy="52" r="36" fill="#005bba"/>
    <text x="152" y="70" font-size="46" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="228" y="72" font-size="60" fill="#12203a">交通・サプライチェーン</text>
    <g fill="#c6d7ec"><rect x="1320" y="24" width="150" height="10" rx="5"/><rect x="1320" y="44" width="150" height="10" rx="5"/><rect x="1320" y="64" width="150" height="10" rx="5"/><rect x="1320" y="84" width="150" height="10" rx="5"/></g>
  </g>
  <g transform="translate(0,575)">
    <rect x="80" y="0" width="1440" height="104" rx="12" fill="#fff" stroke="#d6e3f4" stroke-width="3"/>
    <circle cx="152" cy="52" r="36" fill="#005bba"/>
    <text x="152" y="70" font-size="46" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    <text x="228" y="72" font-size="60" fill="#12203a">重要施設の脆弱性</text>
    <g fill="#c6d7ec"><rect x="1320" y="24" width="150" height="10" rx="5"/><rect x="1320" y="44" width="150" height="10" rx="5"/><rect x="1320" y="64" width="150" height="10" rx="5"/><rect x="1320" y="84" width="150" height="10" rx="5"/></g>
  </g>
  <g transform="translate(0,695)">
    <rect x="80" y="0" width="1440" height="104" rx="12" fill="#fff" stroke="#d6e3f4" stroke-width="3"/>
    <circle cx="152" cy="52" r="36" fill="#005bba"/>
    <text x="152" y="70" font-size="46" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    <text x="228" y="72" font-size="60" fill="#12203a">リアルタイム監視</text>
    <g fill="#c6d7ec"><rect x="1320" y="24" width="150" height="10" rx="5"/><rect x="1320" y="44" width="150" height="10" rx="5"/><rect x="1320" y="64" width="150" height="10" rx="5"/><rect x="1320" y="84" width="150" height="10" rx="5"/></g>
  </g>

  <text x="80" y="862" font-size="44" fill="#7d8fae">※ 実際の画面キャプチャに差し替える予定の模式図です</text>

  <rect x="1240" y="34" width="320" height="104" rx="52" fill="#ffd600"/>
  <text x="1400" y="104" font-size="68" font-weight="700" fill="#050a18" text-anchor="middle">仮画像</text>
</g>
</svg>
