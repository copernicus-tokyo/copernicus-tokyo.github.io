<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img"
     aria-label="データを集約しない仕組みの図。行政・研究機関・民間のデータは各組織に置かれたまま、閲覧者のブラウザの上で重なる。一箇所に集めるためのデータベースはつくらない">
<!-- 表示幅は約454px（縮小率0.28倍）。本文文字は40px以上とし、画面上で11px相当を確保している -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef4fc"/><stop offset="1" stop-color="#dbe7f7"/>
  </linearGradient>
  <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#5b9be6"/>
  </marker>
</defs>

<rect width="1600" height="1000" fill="url(#bg)"/>

<g font-family="'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">

  <text x="80" y="118" font-size="62" font-weight="700" fill="#005bba">集約せずに、重ねる</text>

  <!-- 左：データは各組織に置かれたまま -->
  <g>
    <rect x="80" y="210" width="300" height="100" rx="10" fill="#fff" stroke="#c6d7ec" stroke-width="3"/>
    <rect x="106" y="236" width="48" height="48" rx="6" fill="#005bba"/>
    <rect x="116" y="248" width="28" height="6" rx="3" fill="#fff"/><rect x="116" y="259" width="28" height="6" rx="3" fill="#fff"/><rect x="116" y="270" width="16" height="6" rx="3" fill="#fff"/>
    <text x="176" y="277" font-size="50" fill="#12203a">行政</text>

    <rect x="80" y="330" width="300" height="100" rx="10" fill="#fff" stroke="#c6d7ec" stroke-width="3"/>
    <rect x="106" y="356" width="48" height="48" rx="6" fill="#005bba"/>
    <rect x="116" y="368" width="28" height="6" rx="3" fill="#fff"/><rect x="116" y="379" width="28" height="6" rx="3" fill="#fff"/><rect x="116" y="390" width="16" height="6" rx="3" fill="#fff"/>
    <text x="176" y="397" font-size="50" fill="#12203a">研究機関</text>

    <rect x="80" y="450" width="300" height="100" rx="10" fill="#fff" stroke="#c6d7ec" stroke-width="3"/>
    <rect x="106" y="476" width="48" height="48" rx="6" fill="#005bba"/>
    <rect x="116" y="488" width="28" height="6" rx="3" fill="#fff"/><rect x="116" y="499" width="28" height="6" rx="3" fill="#fff"/><rect x="116" y="510" width="16" height="6" rx="3" fill="#fff"/>
    <text x="176" y="517" font-size="50" fill="#12203a">民間</text>

    <text x="80" y="606" font-size="42" fill="#5a6b87">データは各組織にあるまま</text>
  </g>

  <!-- 中央：参照だけが渡る -->
  <g fill="none" stroke="#5b9be6" stroke-width="5" stroke-dasharray="14 12" marker-end="url(#ar)">
    <path d="M392 260 Q640 260 872 360"/>
    <path d="M392 380 Q640 380 872 385"/>
    <path d="M392 500 Q640 500 872 410"/>
  </g>

  <!-- 右：閲覧者のブラウザの上で重なる -->
  <g>
    <rect x="880" y="180" width="640" height="400" rx="14" fill="#fff" stroke="#c6d7ec" stroke-width="3"/>
    <path d="M880 194 a14 14 0 0 1 14-14 h612 a14 14 0 0 1 14 14 v44 h-640 z" fill="#f5f8fd"/>
    <line x1="880" y1="238" x2="1520" y2="238" stroke="#dfe5ef" stroke-width="3"/>
    <circle cx="912" cy="210" r="9" fill="#cdd6e4"/><circle cx="940" cy="210" r="9" fill="#cdd6e4"/><circle cx="968" cy="210" r="9" fill="#cdd6e4"/>

    <polygon points="1000,490 1200,410 1400,490 1200,570" fill="#fff" stroke="#5b9be6" stroke-width="4"/>
    <g stroke="#a9c6e8" stroke-width="3">
      <line x1="1060" y1="466" x2="1260" y2="546"/><line x1="1120" y1="442" x2="1320" y2="522"/>
      <line x1="1060" y1="514" x2="1260" y2="434"/><line x1="1120" y1="538" x2="1320" y2="458"/>
    </g>
    <polygon points="1000,410 1200,330 1400,410 1200,490" fill="#fff" fill-opacity=".9" stroke="#5b9be6" stroke-width="4"/>
    <ellipse cx="1165" cy="414" rx="92" ry="32" fill="#5b9be6" fill-opacity=".45"/>
    <polygon points="1000,330 1200,250 1400,330 1200,410" fill="#fff" fill-opacity=".94" stroke="#5b9be6" stroke-width="4"/>
    <g fill="#005bba"><circle cx="1148" cy="330" r="13"/><circle cx="1232" cy="308" r="13"/><circle cx="1262" cy="348" r="13"/></g>
  </g>
  <text x="880" y="640" font-size="46" font-weight="700" fill="#12203a">ブラウザの上で重なる</text>

  <!-- 下段：集約用のデータベースをつくらない -->
  <g>
    <rect x="80" y="690" width="1440" height="230" rx="16" fill="#ffffff" fill-opacity=".6" stroke="#d6e3f4" stroke-width="3"/>
    <g>
      <ellipse cx="250" cy="750" rx="95" ry="30" fill="#e3e9f2" stroke="#b3c1d6" stroke-width="4"/>
      <path d="M155 750 L155 860 A95 30 0 0 0 345 860 L345 750" fill="#e3e9f2" stroke="#b3c1d6" stroke-width="4"/>
      <ellipse cx="250" cy="805" rx="95" ry="30" fill="none" stroke="#b3c1d6" stroke-width="3"/>
      <g stroke="#c0392b" stroke-width="16" stroke-linecap="round" stroke-opacity=".85">
        <line x1="145" y1="715" x2="355" y2="895"/><line x1="355" y1="715" x2="145" y2="895"/>
      </g>
    </g>
    <text x="430" y="792" font-size="56" font-weight="700" fill="#12203a">一箇所に集めるための</text>
    <text x="430" y="862" font-size="56" font-weight="700" fill="#12203a">置き場は、つくらない</text>
  </g>

  <text x="80" y="972" font-size="44" fill="#7d8fae">※ 実際の画面キャプチャに差し替える予定の模式図です</text>

  <rect x="1240" y="34" width="320" height="104" rx="52" fill="#ffd600"/>
  <text x="1400" y="104" font-size="68" font-weight="700" fill="#050a18" text-anchor="middle">仮画像</text>
</g>
</svg>
