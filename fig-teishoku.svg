<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img"
     aria-label="風水害のレイヤーセット3段階の図。備え（来襲前）、早め避難（警戒レベル3から4）、いまの状況（初動）の順に、警戒レベルが上がるにつれて重ねるレイヤーを変えることを示す暫定版">
<!-- 表示幅は約454px（縮小率0.28倍）。本文文字は36px以上とし、画面上で10px相当を確保している
     段の色は研究会の配色（青・黄）を使う。気象庁の警戒レベル色（黄・赤・紫）は、
     公的な災害情報と見まがうため使わない（ページ本文の「公的な災害情報ではありません」と揃える）
     「暫定版」は右上の枠に入れてある。スライドのリンク帯が y=800 あたりから重なるため、
     下に注記を置くと隠れてしまう。正式版になったらこの枠ごと消してください -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef4fc"/><stop offset="1" stop-color="#dbe7f7"/>
  </linearGradient>
</defs>

<rect width="1600" height="1000" fill="url(#bg)"/>

<g font-family="'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">

  <rect x="80" y="96" width="10" height="128" fill="#ffd600"/>
  <text x="118" y="164" font-size="72" font-weight="700" fill="#12203a">風水害は、3段階で</text>
  <text x="118" y="216" font-size="42" fill="#5a6b87">警戒レベルが上がるにつれて、見るものを変える</text>

  <!-- 暫定版の表示（正式版になったら、この2行を消してください） -->
  <rect x="1270" y="112" width="250" height="86" rx="43" fill="#fffbe6" stroke="#f0dc8a" stroke-width="4"/>
  <text x="1395" y="170" font-size="48" font-weight="700" fill="#8a7400" text-anchor="middle">暫定版</text>

  <line x1="80" y1="296" x2="1520" y2="296" stroke="#cfddf0" stroke-width="3"/>

  <!-- 1段目：備え -->
  <g>
    <rect x="80" y="340" width="1440" height="132" rx="14" fill="#fffdf2" stroke="#ffd600" stroke-width="4"/>
    <circle cx="152" cy="406" r="38" fill="#ffd600"/>
    <text x="152" y="424" font-size="46" font-weight="700" fill="#050a18" text-anchor="middle">1</text>
    <text x="228" y="398" font-size="56" font-weight="700" fill="#12203a">備え（来襲前）</text>
    <text x="228" y="448" font-size="36" fill="#5a6b87">早期注意情報／台風の接近／警戒レベル2</text>
    <g fill="#f0dc8a">
      <rect x="1340" y="364" width="130" height="10" rx="5"/><rect x="1340" y="386" width="130" height="10" rx="5"/>
      <rect x="1340" y="408" width="130" height="10" rx="5"/><rect x="1340" y="430" width="130" height="10" rx="5"/>
    </g>
  </g>

  <!-- 2段目：早め避難 -->
  <g>
    <rect x="80" y="492" width="1440" height="132" rx="14" fill="#fff" stroke="#9cc0e8" stroke-width="4"/>
    <circle cx="152" cy="558" r="38" fill="#5b9be6"/>
    <text x="152" y="576" font-size="46" font-weight="700" fill="#fff" text-anchor="middle">2</text>
    <text x="228" y="550" font-size="56" font-weight="700" fill="#12203a">早め避難</text>
    <text x="228" y="600" font-size="36" fill="#5a6b87">警戒レベル3（警報）〜4（危険警報）／指定河川洪水予報</text>
    <g fill="#bcd4ee">
      <rect x="1340" y="516" width="130" height="10" rx="5"/><rect x="1340" y="538" width="130" height="10" rx="5"/>
      <rect x="1340" y="560" width="130" height="10" rx="5"/><rect x="1340" y="582" width="130" height="10" rx="5"/>
    </g>
  </g>

  <!-- 3段目：いまの状況 -->
  <g>
    <rect x="80" y="644" width="1440" height="132" rx="14" fill="#fff" stroke="#005bba" stroke-width="4"/>
    <circle cx="152" cy="710" r="38" fill="#005bba"/>
    <text x="152" y="728" font-size="46" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    <text x="228" y="702" font-size="56" font-weight="700" fill="#12203a">いまの状況（初動）</text>
    <text x="228" y="752" font-size="36" fill="#5a6b87">警戒レベル4〜5／発災直後</text>
    <g fill="#9cc0e8">
      <rect x="1340" y="679" width="130" height="10" rx="5"/><rect x="1340" y="701" width="130" height="10" rx="5"/>
      <rect x="1340" y="723" width="130" height="10" rx="5"/>
    </g>
  </g>
  <!-- y=800 より下は、スライドのリンク帯が重なるため空けておく -->

</g>
</svg>
