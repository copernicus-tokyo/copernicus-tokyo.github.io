<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"
     aria-label="オンラインセミナーの告知イメージ。演題「分散する防災データをブラウザでつなぐ」と全3部・60分の構成を示す仮画像">
<!-- 表示幅は約329px（縮小率0.21倍）。本文文字は58px以上とし、画面上で12px相当を確保している -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef4fc"/><stop offset="1" stop-color="#dbe7f7"/>
  </linearGradient>
  <radialGradient id="sun" cx="50%" cy="50%">
    <stop offset="0" stop-color="#ffd600" stop-opacity=".85"/>
    <stop offset="1" stop-color="#ffd600" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>

<g font-family="'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">

  <text x="80" y="118" font-size="66" font-weight="700" fill="#005bba">オンラインセミナー</text>

  <!-- 動画フレーム -->
  <g>
    <rect x="80" y="210" width="700" height="394" rx="14" fill="#050a18"/>
    <circle cx="560" cy="300" r="130" fill="url(#sun)"/>
    <g fill="#d6e2f5">
      <circle cx="160" cy="270" r="4"/><circle cx="250" cy="240" r="3"/><circle cx="330" cy="320" r="4"/>
      <circle cx="200" cy="420" r="3"/><circle cx="410" cy="255" r="4"/><circle cx="140" cy="500" r="3"/>
      <circle cx="300" cy="530" r="4"/><circle cx="500" cy="470" r="3"/><circle cx="660" cy="500" r="4"/>
      <circle cx="710" cy="360" r="3"/><circle cx="580" cy="560" r="4"/><circle cx="400" cy="570" r="3"/>
    </g>
    <ellipse cx="430" cy="410" rx="250" ry="96" fill="none" stroke="#5b9be6" stroke-width="3" stroke-opacity=".55"
             transform="rotate(-18 430 410)"/>
    <ellipse cx="430" cy="410" rx="168" ry="64" fill="none" stroke="#5b9be6" stroke-width="3" stroke-opacity=".4"
             transform="rotate(-18 430 410)"/>
    <circle cx="430" cy="410" r="76" fill="#ffffff" fill-opacity=".96"/>
    <path d="M410 372 L482 410 L410 448 Z" fill="#005bba"/>
  </g>

  <!-- 演題と構成 -->
  <text x="850" y="262" font-size="48" font-weight="700" fill="#7d8fae" letter-spacing="4">演　題</text>
  <text x="850" y="348" font-size="64" font-weight="700" fill="#12203a">分散する防災データを</text>
  <text x="850" y="424" font-size="64" font-weight="700" fill="#12203a">ブラウザでつなぐ</text>
  <text x="850" y="494" font-size="48" fill="#5a6b87">Web地図「SVGMap」の実践</text>

  <rect x="850" y="536" width="360" height="80" rx="40" fill="#ffd600"/>
  <text x="1030" y="590" font-size="52" font-weight="700" fill="#050a18" text-anchor="middle">全3部・60分</text>

  <text x="850" y="682" font-size="48" font-weight="700" fill="#12203a">2026年9月1日〜12月28日</text>
  <text x="850" y="744" font-size="44" fill="#5a6b87">参加費無料・事前登録制</text>

  <text x="80" y="700" font-size="44" fill="#7d8fae">※ 正式な告知バナーに</text>
  <text x="80" y="744" font-size="44" fill="#7d8fae">　差し替える予定の仮デザインです</text>

  <rect x="1240" y="34" width="320" height="104" rx="52" fill="#ffd600"/>
  <text x="1400" y="104" font-size="68" font-weight="700" fill="#050a18" text-anchor="middle">仮画像</text>
</g>
</svg>
