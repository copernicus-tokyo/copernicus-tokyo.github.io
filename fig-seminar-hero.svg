<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img"
     aria-label="防災・減災オンラインセミナー2026の告知。演題は分散する防災データをブラウザでつなぐ。2026年9月1日から12月28日まで配信、参加費無料の事前登録制">
<!-- ヒーローのスライド用（16:10）。成果物カード用の ph-seminar.svg とは縦横比が異なる。
     表示幅は約454px（縮小率0.28倍）。本文文字は44px以上とし、画面上で12px相当を確保している -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef4fc"/><stop offset="1" stop-color="#dbe7f7"/>
  </linearGradient>
  <radialGradient id="sun" cx="50%" cy="50%">
    <stop offset="0" stop-color="#ffd600" stop-opacity=".85"/>
    <stop offset="1" stop-color="#ffd600" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1600" height="1000" fill="url(#bg)"/>

<g font-family="'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif">

  <text x="80" y="116" font-size="62" font-weight="700" fill="#005bba">防災・減災オンラインセミナー2026</text>
  <text x="80" y="176" font-size="44" fill="#5a6b87">研究会メンバーがリレー形式で登壇します</text>

  <!-- 動画のイメージ -->
  <g>
    <rect x="80" y="236" width="660" height="412" rx="14" fill="#050a18"/>
    <circle cx="560" cy="316" r="120" fill="url(#sun)"/>
    <g fill="#d6e2f5">
      <circle cx="150" cy="290" r="4"/><circle cx="240" cy="264" r="3"/><circle cx="320" cy="340" r="4"/>
      <circle cx="190" cy="440" r="3"/><circle cx="400" cy="276" r="4"/><circle cx="132" cy="530" r="3"/>
      <circle cx="300" cy="560" r="4"/><circle cx="500" cy="500" r="3"/><circle cx="640" cy="540" r="4"/>
      <circle cx="690" cy="380" r="3"/><circle cx="560" cy="600" r="4"/><circle cx="410" cy="612" r="3"/>
    </g>
    <ellipse cx="410" cy="440" rx="236" ry="92" fill="none" stroke="#5b9be6" stroke-width="3" stroke-opacity=".55"
             transform="rotate(-18 410 440)"/>
    <ellipse cx="410" cy="440" rx="158" ry="60" fill="none" stroke="#5b9be6" stroke-width="3" stroke-opacity=".4"
             transform="rotate(-18 410 440)"/>
    <circle cx="410" cy="440" r="74" fill="#ffffff" fill-opacity=".96"/>
    <path d="M391 403 L461 440 L391 477 Z" fill="#005bba"/>
  </g>

  <!-- 演題と会期 -->
  <text x="800" y="292" font-size="40" font-weight="700" fill="#7d8fae" letter-spacing="4">演　題</text>
  <text x="800" y="368" font-size="58" font-weight="700" fill="#12203a">分散する防災データを</text>
  <text x="800" y="436" font-size="58" font-weight="700" fill="#12203a">ブラウザでつなぐ</text>
  <text x="800" y="500" font-size="42" fill="#5a6b87">Web地図「SVGMap」の実践</text>

  <rect x="800" y="546" width="330" height="76" rx="38" fill="#ffd600"/>
  <text x="965" y="598" font-size="48" font-weight="700" fill="#050a18" text-anchor="middle">全3部・60分</text>

  <text x="80" y="712" font-size="52" font-weight="700" fill="#12203a">2026年9月1日（火）〜 12月28日（月）</text>
  <text x="80" y="774" font-size="46" fill="#5a6b87">参加費無料・事前登録制／主催：防災ログ実行委員会</text>
  <!-- y=840 より下は、スライドのリンク帯が重なるため空けておく -->

</g>
</svg>
